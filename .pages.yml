          - { name: text, label: Texte, type: text }
          - { name: image, label: Image de fond, type: image }
      - name: kinesiologie
        label: Kinésiologie
        type: object
        fields: &service_fields
          - { name: title, label: Titre, type: string }
          - { name: text, label: Description, type: text }
          - { name: price, label: Tarif, type: string }
          - { name: image, label: Image, type: image }
      - name: emotion
        label: Libération émotionnelle
        type: object
        fields: *service_fields
      - name: reboutement
        label: Reboutement
        type: object
