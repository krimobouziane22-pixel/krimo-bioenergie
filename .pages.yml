media:
  input: assets/images
  output: assets/images
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: global
    label: Réglages généraux
    type: file
    path: content/global.json
    format: json
    operations:
      delete: false
    fields:
      - { name: booking_label, label: Texte du bouton rendez-vous, type: string }
      - { name: booking_url, label: Lien du bouton rendez-vous, type: string }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Téléphone, type: string }
      - { name: address, label: Localisation courte, type: string }
      - { name: footer_location, label: Texte du pied de page, type: string }

  - name: home
    label: Page Accueil
    type: file
    path: content/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero
        label: Grand bandeau d’accueil
        type: object
        fields:
          - { name: eyebrow, label: Petit texte au-dessus du titre, type: string }
          - { name: title, label: Grand titre, type: string }
          - { name: text, label: Texte sous le titre, type: text }
          - { name: image, label: Image de fond, type: image }
      - name: doors
        label: Les 3 portes d’entrée
        type: object
        fields:
          - { name: title, label: Titre de la section, type: string }
          - { name: subtitle, label: Sous-titre, type: text }
          - name: precis
            label: Besoin précis
            type: object
            fields:
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
          - name: accompagnement
            label: Accompagnement
            type: object
            fields:
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
          - name: formation
            label: Formation
            type: object
            fields:
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
      - name: method
        label: Bloc « Vous n’avez pas à choisir »
        type: object
        fields:
          - { name: kicker, label: Petit titre, type: string }
          - { name: title, label: Titre, type: string }
          - { name: p1, label: Paragraphe 1, type: text }
          - { name: p2, label: Paragraphe 2, type: text }
          - { name: image, label: Image, type: image }
      - name: approaches
        label: Mes principales approches
        type: object
        fields:
          - { name: kicker, label: Petit titre, type: string }
          - { name: title, label: Titre, type: string }
          - name: kinesio
            label: Kinésiologie
            type: object
            fields: &approach_fields
              - { name: title, label: Titre, type: string }
              - { name: text, label: Texte, type: text }
              - { name: image, label: Image, type: image }
          - name: emotion
            label: Libération émotionnelle
            type: object
            fields: *approach_fields
          - name: reboutement
            label: Reboutement
            type: object
            fields: *approach_fields
          - name: bioenergie
            label: Bioénergie
            type: object
            fields: *approach_fields
      - name: testimonial
        label: Témoignage
        type: object
        fields:
          - { name: title, label: Titre de section, type: string }
          - { name: quote, label: Témoignage, type: text }
          - { name: author, label: Nom / signature, type: string }
      - name: cta
        label: Bandeau de fin
        type: object
        fields:
          - { name: title, label: Titre, type: string }
          - { name: text, label: Texte, type: text }
          - { name: image, label: Image de fond, type: image }

  - name: seances
